extends:
  - spectral:oas

# Keep this ruleset minimal and pragmatic: enforce core OpenAPI correctness,
# but avoid "style-only" failures that would block iteration.
rules:
  # Swagger UI is generated code-first and may not mirror every tag/grouping decision in `docs/openapi/openapi.yaml`.
  operation-tags: off

  # We deliberately keep some shared components around for forward-compat; don't fail builds on unused components.
  oas3-unused-component: off
